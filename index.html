<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kerala Highway Rider</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 800, H = 450, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

// ---------- helpers ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const rndI = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[Math.floor(Math.random() * a.length)];
const mixC = (a, b, t) => [lerp(a[0], b[0], t) | 0, lerp(a[1], b[1], t) | 0, lerp(a[2], b[2], t) | 0];
const rgb = c => 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
const wrapDiff = (a, b, L) => ((a - b + L / 2) % L + L) % L - L / 2;

// ---------- constants ----------
const SEG = 200, ROAD = 900, CAMH = 800, DRAW = 250;
const CAMD = 1 / Math.tan(100 / 2 * Math.PI / 180);
const PLAYERZ = CAMH * CAMD * 1.25;
const MAXSPEED = SEG * 52;
const ACCEL = MAXSPEED / 5, BRAKE = MAXSPEED / 1.4, DECEL = MAXSPEED / 6;
const OFFLIM = MAXSPEED / 4, OFFDEC = MAXSPEED / 2, CENTRIF = 0.35;
const NSEG = 1980, ZONE = 220, LEN = NSEG * SEG;
const LANES = [-0.75, -0.25, 0.25, 0.75];
const LANE_SPEED = [0.16, 0.22, 0.30, 0.38];
const TYPES = {
  car:   { w: 0.27 },
  bus:   { w: 0.38 },
  auto:  { w: 0.20 },
  lorry: { w: 0.38 }
};
const BIKE_W = 0.11;

// ---------- track ----------
const segs = [];
(function buildTrack() {
  const add = c => segs.push({ index: segs.length, z1: segs.length * SEG, z2: (segs.length + 1) * SEG,
    curve: c, zone: 0, light: 0, deco: [], cars: [], p1: {}, p2: {}, vis: false });
  const eIn = (a, b, p) => a + (b - a) * p * p;
  const eIO = (a, b, p) => a + (b - a) * ((-Math.cos(p * Math.PI) / 2) + 0.5);
  const road = (en, ho, le, c) => {
    for (let i = 0; i < en; i++) add(eIn(0, c, i / en));
    for (let i = 0; i < ho; i++) add(c);
    for (let i = 0; i < le; i++) add(eIO(c, 0, i / le));
  };
  for (let i = 0; i < 70; i++) add(0);
  while (segs.length < NSEG - 100) {
    const r = Math.random();
    if (r < 0.28) { const n = rndI(30, 90); for (let i = 0; i < n; i++) add(0); }
    else {
      const c = rnd(0.5, 1.7) * (Math.random() < 0.5 ? -1 : 1);
      road(rndI(20, 40), rndI(20, 70), rndI(20, 40), c);
    }
  }
  while (segs.length < NSEG) add(0);
  segs.length = NSEG;
  for (let i = NSEG - 40; i < NSEG; i++) segs[i].curve = 0;
  const bldCols = ['#f4d35e', '#ee6c4d', '#7bdff2', '#b2f7ef', '#f7a8b8', '#c3e88d', '#ffd6a5', '#e8e8e8'];
  const signCols = ['#c62828', '#1565c0', '#2e7d32', '#f9a825', '#6a1b9a'];
  for (let i = 0; i < NSEG; i++) {
    const s = segs[i];
    s.zone = Math.floor(i / ZONE) % 3;
    s.light = Math.floor(i / 3) % 2;
    if (i < 12) continue;
    if (s.zone === 0) {
      if (i % 5 === 0) s.deco.push({ k: 'palm', o: -rnd(1.35, 2.0), s: pick([-1, 1]), h: rnd(1.5, 2.0) });
      if (i % 5 === 2) s.deco.push({ k: 'palm', o: rnd(1.35, 2.0), s: pick([-1, 1]), h: rnd(1.5, 2.0) });
      if (i % 37 === 0) s.deco.push({ k: 'bush', o: pick([-1, 1]) * rnd(1.2, 1.5) });
    } else if (s.zone === 1) {
      if (i % 4 === 0) s.deco.push({ k: 'palm', o: -rnd(1.35, 2.2), s: pick([-1, 1]), h: rnd(1.5, 2.0) });
      if (i % 9 === 0) s.deco.push({ k: 'palm', o: rnd(1.3, 1.5), s: -1, h: rnd(1.3, 1.8) });
      if (i % 61 === 0) s.deco.push({ k: 'boat', o: rnd(2.6, 4.2), c: pick(['#e0b050', '#cfa040']) });
    } else {
      if (i % 9 === 0) s.deco.push({ k: 'bld', o: -rnd(1.9, 2.4), w: rnd(1.0, 1.5), h: rnd(1.0, 2.0), c: pick(bldCols), sc: pick(signCols) });
      if (i % 9 === 4) s.deco.push({ k: 'bld', o: rnd(1.9, 2.4), w: rnd(1.0, 1.5), h: rnd(1.0, 2.0), c: pick(bldCols), sc: pick(signCols) });
      if (i % 11 === 3) s.deco.push({ k: 'palm', o: -rnd(1.4, 1.6), s: 1, h: rnd(1.4, 1.8) });
      if (i % 13 === 5) s.deco.push({ k: 'palm', o: rnd(1.4, 1.6), s: -1, h: rnd(1.4, 1.8) });
    }
  }
})();
const segAt = z => segs[Math.floor(((z % LEN) + LEN) % LEN / SEG)];

// ---------- traffic ----------
const cars = [];
function laneType(li) {
  const r = Math.random();
  if (li === 0) return r < 0.40 ? 'auto' : r < 0.75 ? 'lorry' : 'bus';
  if (li === 1) return r < 0.35 ? 'bus' : r < 0.60 ? 'lorry' : r < 0.90 ? 'car' : 'auto';
  if (li === 2) return r < 0.70 ? 'car' : r < 0.85 ? 'bus' : 'lorry';
  return r < 0.85 ? 'car' : 'bus';
}
const CAR_COLS = ['#e8e8e8', '#c0392b', '#2c6cb0', '#222', '#f0c040', '#7a8b99', '#2e8b57', '#f5f5dc'];
const LORRY_COLS = ['#1e6fb5', '#e67e22', '#2e9e5b', '#8e44ad', '#c0392b'];
function spawnTraffic() {
  cars.length = 0;
  for (let li = 0; li < 4; li++) {
    let z = rnd(7000, 12000);
    while (z < LEN - 6000) {
      let ok = true;
      let near = 0;
      for (const c of cars) if (c.li !== li && Math.abs(c.z - z) < 3500) near++;
      if (near >= 2) ok = false;
      if (ok) {
        const type = laneType(li);
        cars.push({ z, li, o: LANES[li], type, speed: LANE_SPEED[li] * MAXSPEED,
          col: type === 'lorry' ? pick(LORRY_COLS) : type === 'bus' ? '#c62828' : type === 'auto' ? '#f2c500' : pick(CAR_COLS), pd: 1e9 });
        z += rnd(7000, 16000);
      } else z += 3000;
    }
  }
}

// ---------- state ----------
let state = 'menu';
let pos = 0, playerX = 0.25, speed = 0, dist = 0, score = 0, best = 0;
let crashT = 0, crashDir = 1, overT = 0, lean = 0, tClock = 0, skyOff = 0, combo = 0, comboT = 0;
let muted = false;
const floaters = [];
try { best = parseInt(localStorage.getItem('khr_best') || '0', 10) || 0; } catch (e) {}

function startGame() {
  pos = 0; playerX = 0.25; speed = 0; dist = 0; score = 0; crashT = 0; combo = 0; comboT = 0; lean = 0;
  floaters.length = 0;
  spawnTraffic();
  for (const c of cars) c.pd = wrapDiff(c.z, pos + PLAYERZ, LEN);
  state = 'play';
}
function endGame() {
  state = 'crash'; crashT = 0; crashDir = Math.random() < 0.5 ? -1 : 1; overT = 0;
  if (score > best) { best = Math.floor(score); try { localStorage.setItem('khr_best', String(best)); } catch (e) {} }
  sfx('crash');
}

// ---------- input ----------
const keys = {};
const touch = { left: false, right: false, brake: false };
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
function tryStart() {
  if (state === 'menu') startGame();
  else if (state === 'over' && overT > 0.7) startGame();
}
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].indexOf(k) >= 0) e.preventDefault();
  if (k === 'enter' || k === ' ') tryStart();
  if (k === 'm') muted = !muted;
  initAudio();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function brakeBtn() { return { x: W - 70, y: H - 80, r: 46 }; }
function readTouches(ev) {
  touch.left = touch.right = touch.brake = false;
  const b = brakeBtn();
  for (let i = 0; i < ev.touches.length; i++) {
    const t = ev.touches[i];
    if (Math.hypot(t.clientX - b.x, t.clientY - b.y) < b.r * 1.3) touch.brake = true;
    else if (t.clientX < W / 2) touch.left = true;
    else touch.right = true;
  }
}
cv.addEventListener('touchstart', e => { e.preventDefault(); initAudio(); tryStart(); readTouches(e); }, { passive: false });
cv.addEventListener('touchmove', e => { e.preventDefault(); readTouches(e); }, { passive: false });
cv.addEventListener('touchend', e => { e.preventDefault(); readTouches(e); }, { passive: false });
cv.addEventListener('touchcancel', e => { readTouches(e); }, { passive: false });
cv.addEventListener('mousedown', () => { initAudio(); tryStart(); });

// ---------- audio ----------
let AC = null, eng = null, engG = null;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    eng = AC.createOscillator(); eng.type = 'sawtooth';
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
    engG = AC.createGain(); engG.gain.value = 0;
    eng.connect(f); f.connect(engG); engG.connect(AC.destination); eng.start();
  } catch (e) { AC = null; }
}
function audioUpdate() {
  if (!AC) return;
  try {
    const on = state === 'play' && !muted;
    engG.gain.setTargetAtTime(on ? 0.06 : 0, AC.currentTime, 0.05);
    eng.frequency.setTargetAtTime(48 + (speed / MAXSPEED) * 140, AC.currentTime, 0.05);
  } catch (e) {}
}
function sfx(kind) {
  if (!AC || muted) return;
  try {
    const t = AC.currentTime;
    if (kind === 'crash') {
      const len = AC.sampleRate * 0.5, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
      const s = AC.createBufferSource(); s.buffer = buf;
      const g = AC.createGain(); g.gain.value = 0.35; s.connect(g); g.connect(AC.destination); s.start(t);
    } else if (kind === 'pass') {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(660, t); o.frequency.exponentialRampToValueAtTime(1320, t + 0.12);
      g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.2);
    }
  } catch (e) {}
}

// ---------- update ----------
function update(dt) {
  tClock += dt;
  const topSpeed = MAXSPEED * (0.72 + 0.28 * Math.min(1, dist / (LEN * 3)));
  const playing = state === 'play';
  const menu = state === 'menu';

  if (playing) {
    const steer = ((keys['arrowright'] || keys['d'] || touch.right) ? 1 : 0) - ((keys['arrowleft'] || keys['a'] || touch.left) ? 1 : 0);
    const braking = keys['arrowdown'] || keys['s'] || touch.brake;
    if (braking) speed = Math.max(0, speed - BRAKE * dt);
    else speed = Math.min(topSpeed, speed + ACCEL * dt);
    const pct = speed / MAXSPEED;
    playerX += steer * dt * 2.6 * (0.3 + 0.7 * Math.min(1, pct * 1.6));
    const ps = segAt(pos + PLAYERZ);
    playerX -= (dt * 2 * pct) * pct * ps.curve * CENTRIF;
    if (Math.abs(playerX) > 1.08 && speed > OFFLIM) speed = Math.max(OFFLIM, speed - OFFDEC * dt);
    playerX = clamp(playerX, -1.9, 1.9);
    lean = lerp(lean, steer * 0.2, Math.min(1, dt * 8));
    skyOff -= ps.curve * (speed * dt / SEG) * 0.7;
    pos = (pos + speed * dt) % LEN;
    dist += speed * dt;
    score += speed * dt * 0.012;
    comboT -= dt; if (comboT <= 0) combo = 0;
  } else if (menu) {
    speed = MAXSPEED * 0.35; playerX = 0.25 + Math.sin(tClock * 0.6) * 0.1;
    const ps = segAt(pos + PLAYERZ);
    skyOff -= ps.curve * (speed * dt / SEG) * 0.7;
    pos = (pos + speed * dt) % LEN; dist += speed * dt;
    lean = Math.cos(tClock * 0.6) * 0.05;
  } else if (state === 'crash') {
    speed = Math.max(0, speed - MAXSPEED * 1.2 * dt);
    pos = (pos + speed * dt) % LEN; dist += speed * dt;
    crashT += dt;
    if (crashT > 1.1) { state = 'over'; overT = 0; }
  } else if (state === 'over') {
    overT += dt;
  }

  // traffic
  for (const s of segs) if (s.cars.length) s.cars.length = 0;
  const pz = pos + PLAYERZ;
  for (const c of cars) {
    c.z = (c.z + c.speed * dt) % LEN;
    segs[Math.floor(c.z / SEG) % NSEG].cars.push(c);
    const dz = wrapDiff(c.z, pz, LEN);
    if (playing) {
      const dx = Math.abs(c.o - playerX);
      const G = (BIKE_W + TYPES[c.type].w) / 2;
      let hit = false;
      if (Math.abs(dz) < SEG * 1.3 && dx < G) hit = true;
      if (!hit && c.pd > 0 && dz <= 0 && Math.abs(c.pd) < SEG * 8 && Math.abs(dz) < SEG * 8) {
        if (dx < G) hit = true;
        else if (dx < G + 0.14 && speed > MAXSPEED * 0.45) {
          combo = Math.min(combo + 1, 6); comboT = 4;
          const b = 50 * combo; score += b;
          floaters.push({ t: 0, txt: 'CLOSE PASS +' + b + (combo > 1 ? '  x' + combo : '') });
          sfx('pass');
        }
      }
      if (hit) { c.pd = dz; endGame(); continue; }
    }
    c.pd = dz;
  }
  for (let i = floaters.length - 1; i >= 0; i--) { floaters[i].t += dt; if (floaters[i].t > 1.4) floaters.splice(i, 1); }
  audioUpdate();
}

// ---------- drawing primitives ----------
function quad(x1, y1, x2, y2, x3, y3, x4, y4, c) {
  ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4); ctx.closePath(); ctx.fill();
}
function strip(l1, r1, y1, l2, r2, y2, c) { quad(l2, y2, r2, y2, r1, y1, l1, y1, c); }
function proj(p, z, camX) {
  p.cz = z - pos;
  p.scale = CAMD / p.cz;
  p.sx = Math.round(W / 2 + p.scale * (-camX) * W / 2);
  p.sy = Math.round(H / 2 + p.scale * CAMH * H / 2);
  p.sw = Math.round(p.scale * ROAD * W / 2);
}

// ---------- environment ----------
let dayD = 1, rainR = 0;
function envUpdate() {
  const tod = (dist / (LEN * 2.5) + 0.06) % 1;
  const k = Math.sin(tod * Math.PI * 2);
  dayD = clamp((k + 0.25) / 0.7, 0, 1);
  rainR = clamp((Math.sin(dist / (LEN * 0.9) * Math.PI * 2 + 1.0) - 0.55) * 3, 0, 1);
  return { tod, k };
}
const rainDrops = [];
for (let i = 0; i < 160; i++) rainDrops.push({ x: Math.random(), y: Math.random(), v: rnd(0.9, 1.6) });

function drawSky(tod, k) {
  const NT = [8, 12, 40], NH = [26, 34, 80], DT = [46, 150, 235], DH = [190, 228, 250], WARM = [255, 150, 80];
  const warm = clamp(1 - Math.abs(k) * 3.2, 0, 1) * 0.8;
  let top = mixC(NT, DT, dayD), hor = mixC(NH, DH, dayD);
  hor = mixC(hor, WARM, warm); top = mixC(top, [120, 90, 150], warm * 0.3);
  top = mixC(top, [90, 100, 112], rainR * 0.65); hor = mixC(hor, [140, 150, 160], rainR * 0.6);
  const g = ctx.createLinearGradient(0, 0, 0, H / 2);
  g.addColorStop(0, rgb(top)); g.addColorStop(1, rgb(hor));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H / 2 + 2);
  // sun / moon
  const half = tod < 0.5, f = (half ? tod : tod - 0.5) * 2;
  const sx = W * (0.1 + 0.8 * f), sy = H * 0.5 - Math.sin(f * Math.PI) * H * 0.36 - 6;
  if (rainR < 0.7) {
    ctx.globalAlpha = 1 - rainR;
    ctx.fillStyle = half ? 'rgba(255,240,170,0.95)' : 'rgba(235,240,255,0.9)';
    ctx.beginPath(); ctx.arc(sx, sy, Math.min(W, H) * (half ? 0.045 : 0.035), 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // clouds
  ctx.fillStyle = 'rgba(255,255,255,' + (0.15 + 0.6 * dayD + 0.2 * rainR) * 0.7 + ')';
  for (let i = 0; i < 6; i++) {
    const cx = (((i * 0.27 * W + skyOff * 0.25 + tClock * 4) % (W + 260)) + (W + 260)) % (W + 260) - 130;
    const cy = H * (0.08 + (i % 3) * 0.08);
    ctx.beginPath(); ctx.ellipse(cx, cy, 70, 16, 0, 0, 7); ctx.ellipse(cx + 30, cy - 8, 40, 14, 0, 0, 7); ctx.fill();
  }
  // hills
  const far = mixC([14, 28, 36], [95, 150, 130], dayD), near = mixC([10, 30, 22], [48, 118, 70], dayD);
  hillLayer(skyOff * 0.5, H * 0.10, rgb(mixC(far, hor, 0.45)), 7, 17);
  hillLayer(skyOff, H * 0.065, rgb(near), 11, 23);
}
function hillLayer(off, amp, col, f1, f2) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H / 2 + 2);
  for (let x = 0; x <= W + 12; x += 12) {
    const t = (x - off) / W;
    ctx.lineTo(x, H / 2 - amp * (0.55 + 0.3 * Math.sin(t * f1) + 0.15 * Math.sin(t * f2 + 1.3)));
  }
  ctx.lineTo(W, H / 2 + 2); ctx.closePath(); ctx.fill();
}

// ---------- sprites ----------
function drawPalm(x, y, h, sd) {
  if (h < 3) return;
  const tx = x + h * 0.05 * sd, ty = y - h;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#6b4423'; ctx.lineWidth = Math.max(1, h * 0.055);
  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + h * 0.12 * sd, y - h * 0.5, tx, ty); ctx.stroke();
  ctx.strokeStyle = '#2f8f3c'; ctx.lineWidth = Math.max(1, h * 0.04);
  for (let i = 0; i < 8; i++) {
    const a = Math.PI + (i / 7) * Math.PI;
    const ex = tx + Math.cos(a) * h * 0.4, ey = ty + Math.sin(a) * h * 0.14 + h * 0.15;
    ctx.beginPath(); ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(tx + Math.cos(a) * h * 0.22, ty + Math.sin(a) * h * 0.3 - h * 0.04, ex, ey); ctx.stroke();
  }
  ctx.fillStyle = '#5d4a1f';
  ctx.beginPath(); ctx.arc(tx - h * 0.025, ty + h * 0.035, h * 0.028, 0, 7); ctx.arc(tx + h * 0.03, ty + h * 0.04, h * 0.028, 0, 7); ctx.fill();
}
function drawBush(x, y, w) {
  ctx.fillStyle = '#2d7a38';
  ctx.beginPath(); ctx.ellipse(x, y - w * 0.12, w * 0.22, w * 0.14, 0, 0, 7); ctx.ellipse(x + w * 0.15, y - w * 0.1, w * 0.15, w * 0.1, 0, 0, 7); ctx.fill();
}
function drawBld(x, y, w, h, d) {
  if (w < 4) return;
  ctx.fillStyle = d.c; ctx.fillRect(x - w / 2, y - h, w, h);
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x - w / 2 - w * 0.03, y - h - h * 0.05, w * 1.06, h * 0.06);
  ctx.fillStyle = d.sc; ctx.fillRect(x - w * 0.4, y - h * 0.38, w * 0.8, h * 0.12);
  const lit = dayD < 0.45;
  ctx.fillStyle = lit ? '#ffe9a0' : '#3b5b78';
  for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++)
    ctx.fillRect(x - w * 0.36 + c * w * 0.26, y - h * 0.9 + r * h * 0.24, w * 0.16, h * 0.14);
  ctx.fillStyle = '#4a3a2a'; ctx.fillRect(x - w * 0.12, y - h * 0.22, w * 0.24, h * 0.22);
}
function drawBoat(x, y, w) {
  if (w < 6) return;
  ctx.fillStyle = '#5a3a1e'; ctx.fillRect(x - w * 0.45, y - w * 0.06, w * 0.9, w * 0.06);
  ctx.fillStyle = '#d8b25a';
  ctx.beginPath(); ctx.ellipse(x, y - w * 0.07, w * 0.36, w * 0.17, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#7a5a2a'; ctx.fillRect(x - w * 0.34, y - w * 0.09, w * 0.68, w * 0.03);
}
function drawVeh(type, col, x, y, pw, glow) {
  if (pw < 2) return;
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(x, y, pw * 0.52, pw * 0.07, 0, 0, 7); ctx.fill();
  const tail = (tx, ty, tw, th) => {
    ctx.fillStyle = glow ? '#ff4040' : '#b01818'; ctx.fillRect(tx, ty, tw, th);
    if (glow) { ctx.fillStyle = 'rgba(255,60,60,0.28)'; ctx.fillRect(tx - tw, ty - th, tw * 3, th * 3); }
  };
  if (type === 'car') {
    ctx.fillStyle = '#111'; ctx.fillRect(x - pw * 0.46, y - pw * 0.12, pw * 0.16, pw * 0.12); ctx.fillRect(x + pw * 0.30, y - pw * 0.12, pw * 0.16, pw * 0.12);
    ctx.fillStyle = col; ctx.fillRect(x - pw / 2, y - pw * 0.42, pw, pw * 0.32);
    quad(x - pw * 0.4, y - pw * 0.42, x - pw * 0.3, y - pw * 0.66, x + pw * 0.3, y - pw * 0.66, x + pw * 0.4, y - pw * 0.42, col);
    quad(x - pw * 0.34, y - pw * 0.44, x - pw * 0.26, y - pw * 0.62, x + pw * 0.26, y - pw * 0.62, x + pw * 0.34, y - pw * 0.44, '#1b2a38');
    tail(x - pw * 0.47, y - pw * 0.38, pw * 0.16, pw * 0.07); tail(x + pw * 0.31, y - pw * 0.38, pw * 0.16, pw * 0.07);
    ctx.fillStyle = '#e8e8e8'; ctx.fillRect(x - pw * 0.1, y - pw * 0.26, pw * 0.2, pw * 0.07);
  } else if (type === 'bus') {
    ctx.fillStyle = '#111'; ctx.fillRect(x - pw * 0.44, y - pw * 0.1, pw * 0.16, pw * 0.1); ctx.fillRect(x + pw * 0.28, y - pw * 0.1, pw * 0.16, pw * 0.1);
    ctx.fillStyle = col; ctx.fillRect(x - pw / 2, y - pw * 0.95, pw, pw * 0.85);
    ctx.fillStyle = '#f4ecd0'; ctx.fillRect(x - pw / 2, y - pw * 0.62, pw, pw * 0.1);
    ctx.fillStyle = '#1b2a38'; ctx.fillRect(x - pw * 0.4, y - pw * 0.88, pw * 0.8, pw * 0.2);
    ctx.fillStyle = '#e0a800'; ctx.fillRect(x - pw / 2, y - pw * 0.97, pw, pw * 0.05);
    tail(x - pw * 0.47, y - pw * 0.42, pw * 0.1, pw * 0.1); tail(x + pw * 0.37, y - pw * 0.42, pw * 0.1, pw * 0.1);
    ctx.fillStyle = '#eee'; ctx.fillRect(x - pw * 0.1, y - pw * 0.3, pw * 0.2, pw * 0.07);
  } else if (type === 'auto') {
    ctx.fillStyle = '#111'; ctx.fillRect(x - pw * 0.1, y - pw * 0.2, pw * 0.2, pw * 0.2);
    ctx.fillStyle = '#1c1c1c'; ctx.fillRect(x - pw * 0.45, y - pw * 0.5, pw * 0.9, pw * 0.34);
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x - pw * 0.45, y - pw * 0.5); ctx.lineTo(x - pw * 0.4, y - pw * 0.95);
    ctx.quadraticCurveTo(x, y - pw * 1.08, x + pw * 0.4, y - pw * 0.95); ctx.lineTo(x + pw * 0.45, y - pw * 0.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1b2a38'; ctx.fillRect(x - pw * 0.3, y - pw * 0.85, pw * 0.6, pw * 0.22);
    tail(x - pw * 0.4, y - pw * 0.44, pw * 0.1, pw * 0.07); tail(x + pw * 0.3, y - pw * 0.44, pw * 0.1, pw * 0.07);
  } else {
    ctx.fillStyle = '#222'; ctx.fillRect(x - pw * 0.46, y - pw * 0.16, pw * 0.18, pw * 0.16); ctx.fillRect(x + pw * 0.28, y - pw * 0.16, pw * 0.18, pw * 0.16);
    ctx.fillStyle = '#333'; ctx.fillRect(x - pw * 0.5, y - pw * 0.3, pw, pw * 0.15);
    ctx.fillStyle = col; ctx.fillRect(x - pw / 2, y - pw * 1.12, pw, pw * 0.84);
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(x - pw / 2, y - pw * 1.12, pw, pw * 0.1);
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x - pw * 0.02, y - pw * 1.1, pw * 0.04, pw * 0.8);
    tail(x - pw * 0.47, y - pw * 0.28, pw * 0.1, pw * 0.08); tail(x + pw * 0.37, y - pw * 0.28, pw * 0.1, pw * 0.08);
  }
}
function drawBike() {
  const u = Math.min(H * 0.005, W * 0.009);
  const bx = W / 2, by = H * 0.9;
  ctx.save();
  ctx.translate(bx, by);
  let rot = lean, ox = 0;
  if (state === 'crash' || state === 'over') {
    const t = Math.min(crashT, 1.1);
    rot = crashDir * Math.min(1.6, t * 3); ox = crashDir * t * 38 * u * 0.4;
  }
  const bob = state === 'play' ? Math.sin(tClock * 38) * (speed / MAXSPEED) * 0.5 * u : 0;
  ctx.translate(ox, bob);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(0, 0, 16 * u, 3 * u, 0, 0, 7); ctx.fill();
  ctx.rotate(rot);
  ctx.scale(u, u);
  // rear tyre
  ctx.fillStyle = '#151515'; ctx.beginPath(); ctx.roundRect(-4.5, -23, 9, 23, 3); ctx.fill();
  // exhaust
  ctx.fillStyle = '#9aa0a6'; ctx.fillRect(6, -14, 4, 11);
  // tail body
  ctx.fillStyle = '#c62828'; ctx.beginPath(); ctx.roundRect(-9, -36, 18, 16, 4); ctx.fill();
  const brk = (keys['arrowdown'] || keys['s'] || touch.brake) && state === 'play';
  ctx.fillStyle = brk ? '#ff5050' : '#ff9a9a'; ctx.fillRect(-4, -32, 8, 3);
  // rider
  ctx.fillStyle = '#1e3a5f'; ctx.beginPath(); ctx.moveTo(-11, -38); ctx.lineTo(-8, -64); ctx.lineTo(8, -64); ctx.lineTo(11, -38); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e8b800'; ctx.fillRect(-7, -62, 14, 4);
  ctx.strokeStyle = '#1e3a5f'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-9, -60); ctx.lineTo(-22, -48); ctx.moveTo(9, -60); ctx.lineTo(22, -48); ctx.stroke();
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-26, -49); ctx.lineTo(26, -49); ctx.stroke();
  ctx.fillStyle = '#bbb'; ctx.fillRect(-27, -56, 3, 7); ctx.fillRect(24, -56, 3, 7);
  // helmet
  ctx.fillStyle = '#f5c400'; ctx.beginPath(); ctx.arc(0, -72, 9.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#1b2a38'; ctx.fillRect(-7, -74, 14, 4);
  ctx.restore();
}

// ---------- render ----------
function render() {
  const { tod, k } = envUpdate();
  drawSky(tod, k);
  const grass = [[63, 155, 63], [55, 143, 56]];
  ctx.fillStyle = rgb(grass[0]); ctx.fillRect(0, H / 2, W, H / 2);

  const base = segs[Math.floor(pos / SEG) % NSEG];
  const bp = (pos % SEG) / SEG;
  let x = 0, dx = -base.curve * bp, maxY = H;
  for (let n = 0; n < DRAW; n++) {
    const s = segs[(base.index + n) % NSEG];
    const loop = s.index < base.index ? LEN : 0;
    const camX = playerX * ROAD;
    proj(s.p1, s.z1 + loop, camX - x);
    proj(s.p2, s.z2 + loop, camX - x - dx);
    x += dx; dx += s.curve;
    s.vis = false;
    if (s.p1.cz <= CAMD || s.p2.sy >= s.p1.sy || s.p2.sy >= maxY) continue;
    s.vis = true;
    drawSeg(s);
    maxY = s.p1.sy;
  }
  for (let n = DRAW - 1; n >= 0; n--) {
    const s = segs[(base.index + n) % NSEG];
    if (!s.vis) continue;
    const p = s.p1;
    for (let i = 0; i < s.deco.length; i++) {
      const d = s.deco[i], dxp = p.sx + p.sw * d.o;
      if (d.k === 'palm') drawPalm(dxp, p.sy, p.sw * d.h, d.s);
      else if (d.k === 'bld') drawBld(dxp, p.sy, p.sw * d.w, p.sw * d.h, d);
      else if (d.k === 'bush') drawBush(dxp, p.sy, p.sw);
      else if (d.k === 'boat') drawBoat(dxp, p.sy, p.sw * 0.8);
    }
    for (let i = 0; i < s.cars.length; i++) {
      const c = s.cars[i], pc = (c.z % SEG) / SEG, q = s.p2;
      const sx = lerp(p.sx, q.sx, pc), sy = lerp(p.sy, q.sy, pc), sw = lerp(p.sw, q.sw, pc);
      drawVeh(c.type, c.col, sx + sw * c.o, sy, sw * TYPES[c.type].w, dayD < 0.5 || rainR > 0.4);
    }
  }
  drawBike();
  // night / rain overlay
  const dark = (1 - dayD) * 0.55 + rainR * 0.14;
  if (dark > 0.01) {
    ctx.fillStyle = 'rgba(4,6,28,' + dark + ')'; ctx.fillRect(0, 0, W, H);
    if (dayD < 0.7) {
      const g = ctx.createRadialGradient(W / 2, H * 0.72, 4, W / 2, H * 0.62, H * 0.55);
      g.addColorStop(0, 'rgba(255,240,190,' + 0.45 * (1 - dayD) + ')'); g.addColorStop(1, 'rgba(255,240,190,0)');
      ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
    }
  }
  if (rainR > 0.02) drawRain();
  drawHUD();
}
function drawSeg(s) {
  const p1 = s.p1, p2 = s.p2, z = s.zone;
  const L = s.light;
  const grass = z === 2 ? (L ? '#6a9b4a' : '#628f44') : (L ? '#3f9b3f' : '#378f38');
  strip(0, W, p1.sy, 0, W, p2.sy, grass);
  if (z === 1) {
    const w = L ? '#2d8fb3' : '#2a86a8';
    strip(p1.sx + p1.sw * 1.6, W + 5, p1.sy, p2.sx + p2.sw * 1.6, W + 5, p2.sy, w);
    strip(p1.sx + p1.sw * 1.5, p1.sx + p1.sw * 1.6, p1.sy, p2.sx + p2.sw * 1.5, p2.sx + p2.sw * 1.6, p2.sy, '#d9c28a');
  }
  const r1 = p1.sw * 0.07, r2 = p2.sw * 0.07, rc = L ? '#d33' : '#f2f2f2';
  strip(p1.sx - p1.sw - r1, p1.sx - p1.sw, p1.sy, p2.sx - p2.sw - r2, p2.sx - p2.sw, p2.sy, rc);
  strip(p1.sx + p1.sw, p1.sx + p1.sw + r1, p1.sy, p2.sx + p2.sw, p2.sx + p2.sw + r2, p2.sy, rc);
  strip(p1.sx - p1.sw, p1.sx + p1.sw, p1.sy, p2.sx - p2.sw, p2.sx + p2.sw, p2.sy, L ? '#585858' : '#525252');
  const e = 0.012;
  strip(p1.sx - p1.sw * 0.97, p1.sx - p1.sw * 0.95, p1.sy, p2.sx - p2.sw * 0.97, p2.sx - p2.sw * 0.95, p2.sy, '#eee');
  strip(p1.sx + p1.sw * 0.95, p1.sx + p1.sw * 0.97, p1.sy, p2.sx + p2.sw * 0.95, p2.sx + p2.sw * 0.97, p2.sy, '#eee');
  strip(p1.sx - p1.sw * 0.02, p1.sx + p1.sw * 0.02, p1.sy, p2.sx - p2.sw * 0.02, p2.sx + p2.sw * 0.02, p2.sy, '#f4c430');
  if (L) for (const o of [-0.5, 0.5])
    strip(p1.sx + p1.sw * (o - e), p1.sx + p1.sw * (o + e), p1.sy, p2.sx + p2.sw * (o - e), p2.sx + p2.sw * (o + e), p2.sy, '#f2f2f2');
  if (rainR > 0.3) strip(p1.sx - p1.sw, p1.sx + p1.sw, p1.sy, p2.sx - p2.sw, p2.sx + p2.sw, p2.sy, 'rgba(160,190,230,' + 0.1 * rainR + ')');
}
function drawRain() {
  ctx.strokeStyle = 'rgba(200,220,255,' + 0.45 * rainR + ')'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  const n = Math.floor(rainDrops.length * rainR);
  for (let i = 0; i < n; i++) {
    const d = rainDrops[i];
    d.y += d.v * 0.025 * (0.6 + speed / MAXSPEED); d.x -= 0.003;
    if (d.y > 1) { d.y = -0.05; d.x = Math.random(); }
    if (d.x < 0) d.x += 1;
    const px = d.x * W, py = d.y * H;
    ctx.moveTo(px, py); ctx.lineTo(px - 4, py + 16);
  }
  ctx.stroke();
}

// ---------- HUD ----------
function txt(s, x, y, size, col, align, weight) {
  ctx.font = (weight || '700') + ' ' + size + 'px system-ui, "Noto Sans Malayalam", sans-serif';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillText(s, x + 2, y + 2);
  ctx.fillStyle = col || '#fff'; ctx.fillText(s, x, y);
}
function drawHUD() {
  const f = Math.max(14, Math.min(W, H) * 0.04);
  if (state === 'play' || state === 'crash' || state === 'over') {
    txt('SCORE ' + Math.floor(score), 14, f + 8, f, '#fff');
    txt((dist * 0.02 / 1000).toFixed(2) + ' km', 14, f * 2 + 10, f * 0.7, '#cfe8ff', 'left', '600');
    txt('BEST ' + best, W - 14, f + 8, f * 0.8, '#ffd76a', 'right');
    txt(Math.round(speed / MAXSPEED * 140) + '', 14, H - 20, f * 1.7, '#fff');
    txt('km/h', 14 + f * 1.9 * (String(Math.round(speed / MAXSPEED * 140)).length) * 0.62 + 8, H - 20, f * 0.7, '#cfe8ff', 'left', '600');
    for (const fl of floaters) {
      ctx.globalAlpha = clamp(1.4 - fl.t, 0, 1);
      txt(fl.txt, W / 2, H * 0.28 - fl.t * 24, f * 0.9, '#7dffb0', 'center');
      ctx.globalAlpha = 1;
    }
    if (isTouch && state === 'play') {
      const b = brakeBtn();
      ctx.fillStyle = touch.brake ? 'rgba(255,80,80,0.6)' : 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
      txt('BRAKE', b.x, b.y + 6, 15, '#fff', 'center');
    }
  }
  if (state === 'menu') {
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, H * 0.14, W, H * 0.5);
    txt('KERALA HIGHWAY RIDER', W / 2, H * 0.28, Math.min(W * 0.075, H * 0.1), '#ffd76a', 'center', '800');
    txt('കേരള ഹൈവേ റൈഡർ', W / 2, H * 0.28 + f * 1.5, f * 1.1, '#fff', 'center');
    txt('Weave through buses, autos and lorries along the coast.', W / 2, H * 0.28 + f * 3.1, f * 0.72, '#e8f4ff', 'center', '500');
    txt(isTouch ? 'Touch left / right side to steer  ·  BRAKE button' : '← → steer   ·   ↓ brake   ·   M sound', W / 2, H * 0.28 + f * 4.2, f * 0.72, '#e8f4ff', 'center', '500');
    if (Math.floor(tClock * 2) % 2 === 0) txt(isTouch ? 'TAP TO START' : 'PRESS ENTER OR CLICK TO START', W / 2, H * 0.28 + f * 5.8, f, '#7dffb0', 'center');
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, H * 0.22, W, H * 0.36);
    txt('CRASHED!', W / 2, H * 0.34, Math.min(W * 0.08, H * 0.11), '#ff6b6b', 'center', '800');
    txt('Score ' + Math.floor(score) + '    Best ' + best + '    ' + (dist * 0.02 / 1000).toFixed(2) + ' km', W / 2, H * 0.34 + f * 1.8, f, '#fff', 'center');
    if (overT > 0.7 && Math.floor(tClock * 2) % 2 === 0) txt(isTouch ? 'TAP TO RIDE AGAIN' : 'PRESS ENTER OR CLICK TO RIDE AGAIN', W / 2, H * 0.34 + f * 3.4, f * 0.9, '#7dffb0', 'center');
  }
}

// ---------- main loop ----------
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
  last = ts;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
spawnTraffic();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
