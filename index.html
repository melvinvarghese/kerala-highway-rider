<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="An endless motorbike traffic game set on the roads of Kerala.">
<meta name="theme-color" content="#1c3b2a">
<link rel="icon" href="data:,">
<title>Kerala Highway Rider</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
if (!ctx.roundRect) ctx.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };
let W = 800, H = 450, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

// ---------- helpers ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const rndI = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[Math.floor(Math.random() * a.length)];
const mixC = (a, b, t) => [lerp(a[0], b[0], t) | 0, lerp(a[1], b[1], t) | 0, lerp(a[2], b[2], t) | 0];
const rgb = c => 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
const wrapDiff = (a, b, L) => ((a - b + L / 2) % L + L) % L - L / 2;
const plateNo = () => 'KL ' + String(rndI(1, 86)).padStart(2, '0');

// ---------- constants ----------
const SEG = 200, ROAD = 900, CAMH = 800, DRAW = 250;
const CAMD = 1 / Math.tan(100 / 2 * Math.PI / 180);
const PLAYERZ = CAMH * CAMD * 1.25;
const MAXSPEED = SEG * 52;
const ACCEL = MAXSPEED / 5, BRAKE = MAXSPEED / 1.4;
const OFFLIM = MAXSPEED / 4, OFFDEC = MAXSPEED / 2, CENTRIF = 0.35;
const ZONE_LEN = 330, NZONE = 6, NSEG = ZONE_LEN * NZONE, LEN = NSEG * SEG;
const LANES = [-0.75, -0.25, 0.25, 0.75];
const LANE_SPEED = [0.14, 0.21, 0.30, 0.40];
const BIKE_W = 0.11;
const ZONE_NAMES = ['Alappuzha backwaters', 'Kuttanad paddy fields', 'Rubber country', 'Munnar tea hills', 'Town market', 'Malabar coast'];
const HILLZ = 3;
const W_OF = {
  car: 0.27, taxi: 0.27, mpv: 0.28, omni: 0.24, ambulance: 0.30,
  busS: 0.38, busP: 0.38, busSch: 0.38, busT: 0.38,
  auto: 0.20, pickup: 0.27, lorry: 0.36, tipper: 0.36, fish: 0.34,
  scooter: 0.12, cycle: 0.09, cow: 0.17, goat: 0.10
};

// ---------- track ----------
function elev(i) {
  let y = 250 * Math.sin(2 * Math.PI * i * 6 / NSEG);
  const hs = HILLZ * ZONE_LEN;
  if (i >= hs && i <= hs + ZONE_LEN) {
    const t = (i - hs) / ZONE_LEN, env = 0.5 * (1 - Math.cos(2 * Math.PI * t));
    y += env * (700 + 1400 * Math.sin(2 * Math.PI * t * 2.5));
  }
  return y;
}
function hillEnv(i) {
  const hs = HILLZ * ZONE_LEN;
  if (i < hs || i > hs + ZONE_LEN) return 0;
  return 0.5 * (1 - Math.cos(2 * Math.PI * (i - hs) / ZONE_LEN));
}
const segs = [];
(function buildTrack() {
  const add = c => {
    const i = segs.length;
    segs.push({ index: i, z1: i * SEG, z2: (i + 1) * SEG, y1: elev(i), y2: elev(i + 1), curve: c,
      zone: Math.floor(i / ZONE_LEN), light: Math.floor(i / 3) % 2, deco: [], cars: [], pud: [], g: '', p1: {}, p2: {}, vis: false, clip: 0 });
  };
  const eIn = (a, b, p) => a + (b - a) * p * p;
  const eIO = (a, b, p) => a + (b - a) * ((-Math.cos(p * Math.PI) / 2) + 0.5);
  const road = (en, ho, le, c) => {
    for (let i = 0; i < en; i++) add(eIn(0, c, i / en));
    for (let i = 0; i < ho; i++) add(c);
    for (let i = 0; i < le; i++) add(eIO(c, 0, i / le));
  };
  for (let i = 0; i < 70; i++) add(0);
  while (segs.length < NSEG - 100) {
    const zone = Math.floor(segs.length / ZONE_LEN);
    const hill = zone === HILLZ;
    if (!hill && Math.random() < 0.28) { const n = rndI(30, 90); for (let i = 0; i < n; i++) add(0); }
    else if (hill && Math.random() < 0.12) { const n = rndI(15, 35); for (let i = 0; i < n; i++) add(0); }
    else {
      const mag = hill ? rnd(1.3, 2.5) : (zone === 0 || zone === 5) ? rnd(0.4, 1.1) : rnd(0.5, 1.6);
      road(rndI(20, 40), rndI(hill ? 15 : 20, hill ? 40 : 70), rndI(20, 40), mag * (Math.random() < 0.5 ? -1 : 1));
    }
  }
  while (segs.length < NSEG) add(0);
  segs.length = NSEG;
  for (let i = NSEG - 40; i < NSEG; i++) segs[i].curve = 0;

  const bldCols = ['#f4d35e', '#ee6c4d', '#7bdff2', '#b2f7ef', '#f7a8b8', '#c3e88d', '#ffd6a5', '#e8e8e8'];
  const signCols = ['#c62828', '#1565c0', '#2e7d32', '#f9a825', '#6a1b9a'];
  const shops = ['TEA STALL', 'FRESH FISH', 'BAKERY', 'TEXTILES', 'PHARMACY', 'PROVISIONS', 'MOBILE SHOP', 'HOTEL', 'VEGETABLES', 'HARDWARE'];
  const banners = ['ONAM OFFERS', 'GRAND SALE', 'WELCOME', 'FRESH FISH', 'NEW ARRIVALS'];
  const flagCols = ['#e53935', '#fdd835', '#43a047', '#1e88e5', '#fb8c00'];
  for (let i = 0; i < NSEG; i++) {
    const s = segs[i], z = s.zone, L = s.light;
    // ground colours
    if (z === 0) s.g = L ? '#3f9b3f' : '#378f38';
    else if (z === 1) { const p = Math.floor(i / 22) % 3; s.g = [['#86c240', '#7cb83a'], ['#8fbfcf', '#86b5c6'], ['#b9c84a', '#adbd42']][p][L]; }
    else if (z === 2) s.g = L ? '#46703a' : '#3f6634';
    else if (z === 3) { const b = Math.floor(i / 4) % 2; s.g = b ? (L ? '#5aa83f' : '#52a03a') : (L ? '#4d9a37' : '#459132'); }
    else if (z === 4) s.g = L ? '#6a9b4a' : '#628f44';
    else s.g = L ? '#e6d6a4' : '#dccb98';
    if (i < 12) continue;
    const d = s.deco, sg = () => pick([-1, 1]);
    if (z === 0) {
      if (i % 5 === 0) d.push({ k: 'palm', o: -rnd(1.35, 2.0), s: sg(), h: rnd(1.5, 2.0) });
      if (i % 5 === 2) d.push({ k: 'palm', o: rnd(1.3, 1.5), s: -1, h: rnd(1.4, 1.9) });
      if (i % 23 === 0) d.push({ k: 'banana', o: -rnd(1.25, 1.5) });
      if (i % 61 === 0) d.push({ k: 'boat', o: rnd(2.6, 4.2) });
      if (i % 83 === 11) d.push({ k: 'net', o: rnd(2.3, 3.2) });
    } else if (z === 1) {
      if (i % 9 === 0) d.push({ k: 'palm', o: sg() * rnd(2.0, 4.0), s: sg(), h: rnd(1.5, 2.0) });
      if (i % 29 === 0) d.push({ k: 'banana', o: sg() * rnd(1.3, 1.8) });
      if (i % 47 === 5) d.push({ k: 'scare', o: sg() * rnd(1.6, 2.6) });
      if (i % 71 === 9) d.push({ k: 'hut', o: sg() * rnd(2.0, 3.0) });
    } else if (z === 2) {
      if (i % 2 === 0) d.push({ k: 'rubber', o: -rnd(1.2, 1.7) });
      if (i % 2 === 1) d.push({ k: 'rubber', o: rnd(1.2, 1.7) });
      if (i % 3 === 0) d.push({ k: 'rubber', o: -rnd(2.0, 3.2) });
      if (i % 3 === 1) d.push({ k: 'rubber', o: rnd(2.0, 3.2) });
    } else if (z === 3) {
      if (i % 4 === 0) d.push({ k: 'tea', o: -rnd(1.25, 1.6) });
      if (i % 4 === 2) d.push({ k: 'tea', o: rnd(1.25, 1.6) });
      if (i % 7 === 0) d.push({ k: 'pine', o: -rnd(1.8, 3.0) });
      if (i % 7 === 3) d.push({ k: 'pine', o: rnd(1.8, 3.0) });
      if (i % 5 === 0) d.push({ k: 'post', o: 1.12 });
      if (i % 5 === 0) d.push({ k: 'post', o: -1.12 });
    } else if (z === 4) {
      if (i % 9 === 0) d.push({ k: 'bld', o: -rnd(1.9, 2.3), w: rnd(1.0, 1.4), h: rnd(1.0, 1.9), c: pick(bldCols), sc: pick(signCols), t: pick(shops) });
      if (i % 9 === 4) d.push({ k: 'bld', o: rnd(1.9, 2.3), w: rnd(1.0, 1.4), h: rnd(1.0, 1.9), c: pick(bldCols), sc: pick(signCols), t: pick(shops) });
      if (i % 11 === 3) d.push({ k: 'palm', o: -rnd(1.4, 1.6), s: 1, h: rnd(1.4, 1.8) });
      if (i % 13 === 5) d.push({ k: 'palm', o: rnd(1.4, 1.6), s: -1, h: rnd(1.4, 1.8) });
      if (i % 17 === 8) d.push({ k: 'pole', o: sg() * 1.2 });
      if (i % 21 === 2) d.push({ k: 'flags', o: -1.2, cs: flagCols });
      if (i % 37 === 6) d.push({ k: 'banner', o: 1.25, c: pick(signCols), t: pick(banners) });
      if (i === ZONE_LEN * 4 + 60) d.push({ k: 'church', o: -2.4 });
      if (i === ZONE_LEN * 4 + 140) d.push({ k: 'temple', o: 2.4 });
      if (i === ZONE_LEN * 4 + 230) d.push({ k: 'mosque', o: -2.4 });
    } else {
      if (i % 5 === 0) d.push({ k: 'palm', o: -rnd(1.35, 2.0), s: sg(), h: rnd(1.5, 2.0) });
      if (i % 6 === 3) d.push({ k: 'palm', o: rnd(1.3, 1.8), s: -1, h: rnd(1.4, 1.9) });
      if (i % 19 === 4) d.push({ k: 'fboat', o: rnd(1.6, 2.4), c: pick(['#e53935', '#1e88e5', '#fdd835', '#43a047']) });
      if (i === ZONE_LEN * 5 + 200) d.push({ k: 'light', o: -2.6 });
    }
    if (i % 41 === 7 && i > 30) s.pud.push({ o: pick(LANES) + rnd(-0.1, 0.1) });
  }
})();
const segAt = z => segs[Math.floor(((z % LEN) + LEN) % LEN / SEG)];

// ---------- traffic ----------
const cars = [];
const CAR_COLS = ['#e8e8e8', '#c0392b', '#2c6cb0', '#222', '#f0c040', '#7a8b99', '#2e8b57', '#f5f5dc'];
function makeVeh(type, li, z) {
  let col = '#ccc';
  if (type === 'car') col = pick(CAR_COLS);
  else if (type === 'taxi') col = pick(['#f5f1e0', '#222', '#d9a400', '#e8e8e8']);
  else if (type === 'mpv') col = pick(['#e8e8e8', '#9aa5ad', '#2a2a2a', '#f1f1f1']);
  else if (type === 'omni') col = pick(['#f2f2f2', '#c8d2d9', '#b83228']);
  else if (type === 'busP') col = pick(['#1b7a3d', '#c25a00', '#6a2c91', '#0c7c8c', '#b3002d']);
  else if (type === 'lorry') col = pick(['#1e6fb5', '#2e9e5b', '#e67e22', '#7b2d26', '#c0392b']);
  else if (type === 'pickup') col = pick(['#5aa02c', '#e0b020']);
  else if (type === 'scooter') col = pick(['#c0392b', '#2c6cb0', '#f0c040', '#7a8b99']);
  return { z, li, o: LANES[li], type, speed: LANE_SPEED[li] * MAXSPEED, col, plate: plateNo(), pd: 1e9, animal: false };
}
function laneType(li) {
  const r = Math.random();
  if (li === 0) return r < 0.15 ? 'cycle' : r < 0.35 ? 'scooter' : r < 0.65 ? 'auto' : r < 0.85 ? 'pickup' : 'tipper';
  if (li === 1) return r < 0.30 ? 'lorry' : r < 0.45 ? 'fish' : r < 0.70 ? 'busP' : r < 0.85 ? 'omni' : 'tipper';
  if (li === 2) return r < 0.30 ? 'taxi' : r < 0.50 ? 'mpv' : r < 0.70 ? 'busS' : r < 0.80 ? 'busSch' : 'car';
  return r < 0.30 ? 'mpv' : r < 0.50 ? 'taxi' : r < 0.75 ? 'car' : r < 0.90 ? 'busT' : r < 0.95 ? 'ambulance' : 'busS';
}
function spawnTraffic() {
  cars.length = 0;
  for (let li = 0; li < 4; li++) {
    let z = rnd(7000, 12000);
    while (z < LEN - 6000) {
      let near = 0;
      for (const c of cars) if (c.li !== li && Math.abs(c.z - z) < 3500) near++;
      if (near < 2) { cars.push(makeVeh(laneType(li), li, z)); z += rnd(7000, 16000); }
      else z += 3000;
    }
  }
}
let animalT = 14;
function spawnAnimal() {
  const type = Math.random() < 0.6 ? 'cow' : 'goat';
  const side = pick([-1, 1]);
  const a = { z: (pos + PLAYERZ + rnd(40000, 50000)) % LEN, li: -1, o: side * 1.15, type, speed: 0, col: '#fff', plate: '',
    pd: 1e9, animal: true, vo: -side * rnd(0.16, 0.26), seed: Math.random() * 6 };
  cars.push(a);
}

// ---------- state ----------
let state = 'menu';
let pos = 0, playerX = 0.25, speed = 0, dist = 0, score = 0, best = 0;
let crashT = 0, crashDir = 1, overT = 0, lean = 0, tClock = 0, skyOff = 0, combo = 0, comboT = 0;
let slipT = 0, slipDir = 1, slipCool = 0, honkT = 0, curZone = -1, toast = null;
let muted = false;
const floaters = [];
try { best = parseInt(localStorage.getItem('khr_best') || '0', 10) || 0; } catch (e) {}

function startGame() {
  pos = 0; playerX = 0.25; speed = 0; dist = 0; score = 0; crashT = 0; combo = 0; comboT = 0; lean = 0; slipT = 0; honkT = 0;
  animalT = 14; curZone = -1;
  floaters.length = 0;
  spawnTraffic();
  for (const c of cars) c.pd = wrapDiff(c.z, pos + PLAYERZ, LEN);
  state = 'play';
  if (isTouch) { try { const el = document.documentElement; if (el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().catch(() => {}); } catch (e) {} }
}
function endGame() {
  state = 'crash'; crashT = 0; crashDir = Math.random() < 0.5 ? -1 : 1; overT = 0;
  if (score > best) { best = Math.floor(score); try { localStorage.setItem('khr_best', String(best)); } catch (e) {} }
  sfx('crash');
}
function honk() {
  if (state !== 'play' || honkT > 0) return;
  honkT = 0.45; sfx('horn');
  const pz = pos + PLAYERZ;
  for (const c of cars) if (c.animal) {
    const dz = wrapDiff(c.z, pz, LEN);
    if (dz > 0 && dz < 36000) c.vo = (c.o >= 0 ? 1 : -1) * 0.55;
  }
}

// ---------- input ----------
const keys = {};
const touch = { left: false, right: false, brake: false, horn: false };
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
function tryStart() {
  if (state === 'menu') startGame();
  else if (state === 'over' && overT > 0.7) startGame();
}
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].indexOf(k) >= 0) e.preventDefault();
  if (k === 'enter' || k === ' ') { if (state === 'play') { if (k === ' ') honk(); } else tryStart(); }
  if (k === 'h') honk();
  if (k === 'm') muted = !muted;
  if (k === 'f') { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (er) {} }
  initAudio();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
const brakeBtn = () => ({ x: W - 70, y: H - 80, r: 46 });
const hornBtn = () => ({ x: 70, y: H - 80, r: 40 });
function readTouches(ev) {
  const hornWas = touch.horn;
  touch.left = touch.right = touch.brake = touch.horn = false;
  const b = brakeBtn(), h = hornBtn();
  for (let i = 0; i < ev.touches.length; i++) {
    const t = ev.touches[i];
    if (Math.hypot(t.clientX - b.x, t.clientY - b.y) < b.r * 1.3) touch.brake = true;
    else if (Math.hypot(t.clientX - h.x, t.clientY - h.y) < h.r * 1.3) touch.horn = true;
    else if (t.clientX < W / 2) touch.left = true;
    else touch.right = true;
  }
  if (touch.horn && !hornWas) honk();
}
cv.addEventListener('touchstart', e => { e.preventDefault(); initAudio(); tryStart(); readTouches(e); }, { passive: false });
cv.addEventListener('touchmove', e => { e.preventDefault(); readTouches(e); }, { passive: false });
cv.addEventListener('touchend', e => { e.preventDefault(); readTouches(e); }, { passive: false });
cv.addEventListener('touchcancel', e => { readTouches(e); }, { passive: false });
cv.addEventListener('mousedown', () => { initAudio(); tryStart(); });

// ---------- audio ----------
let AC = null, eng = null, engG = null, rainG = null;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    eng = AC.createOscillator(); eng.type = 'sawtooth';
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
    engG = AC.createGain(); engG.gain.value = 0;
    eng.connect(f); f.connect(engG); engG.connect(AC.destination); eng.start();
    const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const ns = AC.createBufferSource(); ns.buffer = buf; ns.loop = true;
    const nf = AC.createBiquadFilter(); nf.type = 'highpass'; nf.frequency.value = 1800;
    rainG = AC.createGain(); rainG.gain.value = 0;
    ns.connect(nf); nf.connect(rainG); rainG.connect(AC.destination); ns.start();
  } catch (e) { AC = null; }
}
function audioUpdate() {
  if (!AC) return;
  try {
    const on = state === 'play' && !muted;
    engG.gain.setTargetAtTime(on ? 0.06 : 0, AC.currentTime, 0.05);
    eng.frequency.setTargetAtTime(48 + (speed / MAXSPEED) * 140, AC.currentTime, 0.05);
    rainG.gain.setTargetAtTime(muted ? 0 : rainR * 0.05, AC.currentTime, 0.3);
  } catch (e) {}
}
function sfx(kind) {
  if (!AC || muted) return;
  try {
    const t = AC.currentTime;
    if (kind === 'crash') {
      const len = AC.sampleRate * 0.5, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
      const s = AC.createBufferSource(); s.buffer = buf;
      const g = AC.createGain(); g.gain.value = 0.35; s.connect(g); g.connect(AC.destination); s.start(t);
    } else if (kind === 'pass') {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(660, t); o.frequency.exponentialRampToValueAtTime(1320, t + 0.12);
      g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.2);
    } else if (kind === 'horn') {
      for (const fr of [392, 494]) {
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = 'square'; o.frequency.value = fr;
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.08, t + 0.03); g.gain.setValueAtTime(0.08, t + 0.3); g.gain.linearRampToValueAtTime(0.0001, t + 0.42);
        o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.45);
      }
    } else if (kind === 'skid') {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(900, t); o.frequency.exponentialRampToValueAtTime(300, t + 0.3);
      g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.32);
    }
  } catch (e) {}
}

// ---------- update ----------
function update(dt) {
  tClock += dt;
  if (honkT > 0) honkT -= dt;
  const topSpeed = MAXSPEED * (0.72 + 0.28 * Math.min(1, dist / (LEN * 3)));
  const playing = state === 'play';
  const menu = state === 'menu';

  if (playing) {
    const steer = ((keys['arrowright'] || keys['d'] || touch.right) ? 1 : 0) - ((keys['arrowleft'] || keys['a'] || touch.left) ? 1 : 0);
    const braking = keys['arrowdown'] || keys['s'] || touch.brake;
    if (braking) speed = Math.max(0, speed - BRAKE * dt);
    else speed = Math.min(topSpeed, speed + ACCEL * dt);
    const pct = speed / MAXSPEED;
    playerX += steer * dt * 2.6 * (0.3 + 0.7 * Math.min(1, pct * 1.6));
    const ps = segAt(pos + PLAYERZ);
    playerX -= (dt * 2 * pct) * pct * ps.curve * CENTRIF;
    if (Math.abs(playerX) > 1.08 && speed > OFFLIM) speed = Math.max(OFFLIM, speed - OFFDEC * dt);
    // puddles
    if (slipCool > 0) slipCool -= dt;
    if (rainR > 0.25 && slipCool <= 0) {
      for (const p of ps.pud) if (Math.abs(p.o - playerX) < 0.11 && speed > MAXSPEED * 0.3) {
        slipT = 0.5; slipDir = Math.random() < 0.5 ? -1 : 1; slipCool = 1.0; speed *= 0.9;
        floaters.push({ t: 0, txt: 'SKID!', bad: true }); sfx('skid');

    }
    if (slipT > 0) { slipT -= dt; playerX += slipDir * dt * 1.5; }
    playerX = clamp(playerX, -1.9, 1.9);
    lean = lerp(lean, steer * 0.2 + (slipT > 0 ? slipDir * 0.15 : 0), Math.min(1, dt * 8));
    skyOff -= ps.curve * (speed * dt / SEG) * 0.7;
    pos = (pos + speed * dt) % LEN;
    dist += speed * dt;
    score += speed * dt * 0.012;
    comboT -= dt; if (comboT <= 0) combo = 0;
    animalT -= dt;

  } else if (menu) {
    speed = MAXSPEED * 0.35; playerX = 0.25 + Math.sin(tClock * 0.6) * 0.1;
    const ps = segAt(pos + PLAYERZ);
    skyOff -= ps.curve * (speed * dt / SEG) * 0.7;
    pos = (pos + speed * dt) % LEN; dist += speed * dt;
    lean = Math.cos(tClock * 0.6) * 0.05;
  } else if (state === 'crash') {
    speed = Math.max(0, speed - MAXSPEED * 1.2 * dt);
    pos = (pos + speed * dt) % LEN; dist += speed * dt;
    crashT += dt;
    if (crashT > 1.1) { state = 'over'; overT = 0; }
  } else if (state === 'over') {
    overT += dt;
  }

  // zone toast
  if (playing || menu) {
    const zi = segAt(pos + PLAYERZ).zone;
    if (zi !== curZone) { curZone = zi; toast = { t: 0, txt: ZONE_NAMES[zi] }; }
  }

  // traffic
  for (const s of segs) if (s.cars.length) s.cars.length = 0;
  const pz = pos + PLAYERZ;
  for (let i = cars.length - 1; i >= 0; i--) {
    const c = cars[i];

    if (c.animal) {
      c.o += c.vo * dt;
      if (Math.abs(c.o) > 1.3) { c.o = Math.sign(c.o) * 1.3; c.vo = 0; }
      if (wrapDiff(c.z, pz, LEN) < -SEG * 12) { cars.splice(i, 1); continue; }
    }
    segs[Math.floor(c.z / SEG) % NSEG].cars.push(c);
    const dz = wrapDiff(c.z, pz, LEN);
    if (playing) {
      const dx = Math.abs(c.o - playerX);
      const G = (BIKE_W + W_OF[c.type]) / 2;
      let hit = false;
      if (Math.abs(dz) < SEG * 1.3 && dx < G) hit = true;
      if (!hit && c.pd > 0 && dz <= 0 && Math.abs(c.pd) < SEG * 8 && Math.abs(dz) < SEG * 8) {
        if (dx < G) hit = true;
        else if (dx < G + 0.14 && speed > MAXSPEED * 0.45) {

          const b = 50 * combo; score += b;
          floaters.push({ t: 0, txt: 'CLOSE PASS +' + b + (combo > 1 ? '  x' + combo : '') });

      if (hit) { c.pd = dz; endGame(); continue; }
    }
    c.pd = dz;
  }
  for (let i = floaters.length - 1; i >= 0; i--) { floaters[i].t += dt; if (floaters[i].t > 1.4) floaters.splice(i, 1); }
  audioUpdate();
}

    const g = ctx.createLinearGradient(0, H * 0.2, 0, H * 0.62);
    g.addColorStop(0, 'rgba(235,240,245,0)'); g.addColorStop(0.55, 'rgba(235,240,245,' + 0.4 * env + ')'); g.addColorStop(1, 'rgba(235,240,245,0)');
    ctx.fillStyle = g; ctx.fillRect(0, H * 0.2, W, H * 0.42);
  }
  const dark = (1 - dayD) * 0.55 + rainR * 0.14;
  if (dark > 0.01) {
    ctx.fillStyle = 'rgba(4,6,28,' + dark + ')'; ctx.fillRect(0, 0, W, H);
    if (dayD < 0.7) {
      const g = ctx.createRadialGradient(W / 2, H * 0.72, 4, W / 2, H * 0.62, H * 0.55);
      g.addColorStop(0, 'rgba(255,240,190,' + 0.45 * (1 - dayD) + ')'); g.addColorStop(1, 'rgba(255,240,190,0)');
      ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
    }
  }
  if (rainR > 0.02) drawRain();
  drawHUD();
}
function drawSeg(s) {
  const p1 = s.p1, p2 = s.p2, z = s.zone;
  const L = s.light;
  strip(0, W, p1.sy, 0, W, p2.sy, s.g);
  if (z === 0) {
    const w = L ? '#2d8fb3' : '#2a86a8';
    strip(p1.sx + p1.sw * 1.6, W + 5, p1.sy, p2.sx + p2.sw * 1.6, W + 5, p2.sy, w);
    strip(p1.sx + p1.sw * 1.5, p1.sx + p1.sw * 1.6, p1.sy, p2.sx + p2.sw * 1.5, p2.sx + p2.sw * 1.6, p2.sy, '#d9c28a');
  } else if (z === 5) {
    const w = L ? '#2a86a8' : '#2d8fb3';
    strip(p1.sx + p1.sw * 2.4, W + 5, p1.sy, p2.sx + p2.sw * 2.4, W + 5, p2.sy, w);
    strip(p1.sx + p1.sw * 2.1, p1.sx + p1.sw * 2.4, p1.sy, p2.sx + p2.sw * 2.1, p2.sx + p2.sw * 2.4, p2.sy, '#f4f0e6');
  }
  const r1 = p1.sw * 0.07, r2 = p2.sw * 0.07, rc = L ? '#d33' : '#f2f2f2';
  strip(p1.sx - p1.sw - r1, p1.sx - p1.sw, p1.sy, p2.sx - p2.sw - r2, p2.sx - p2.sw, p2.sy, rc);
  strip(p1.sx + p1.sw, p1.sx + p1.sw + r1, p1.sy, p2.sx + p2.sw, p2.sx + p2.sw + r2, p2.sy, rc);
  strip(p1.sx - p1.sw, p1.sx + p1.sw, p1.sy, p2.sx - p2.sw, p2.sx + p2.sw, p2.sy, L ? '#585858' : '#525252');
  const e = 0.012;
  strip(p1.sx - p1.sw * 0.97, p1.sx - p1.sw * 0.95, p1.sy, p2.sx - p2.sw * 0.97, p2.sx - p2.sw * 0.95, p2.sy, '#eee');
  strip(p1.sx + p1.sw * 0.95, p1.sx + p1.sw * 0.97, p1.sy, p2.sx + p2.sw * 0.95, p2.sx + p2.sw * 0.97, p2.sy, '#eee');
  strip(p1.sx - p1.sw * 0.02, p1.sx + p1.sw * 0.02, p1.sy, p2.sx - p2.sw * 0.02, p2.sx + p2.sw * 0.02, p2.sy, '#f4c430');
  if (L) for (const o of [-0.5, 0.5])
    strip(p1.sx + p1.sw * (o - e), p1.sx + p1.sw * (o + e), p1.sy, p2.sx + p2.sw * (o - e), p2.sx + p2.sw * (o + e), p2.sy, '#f2f2f2');
  if (rainR > 0.3) {
    strip(p1.sx - p1.sw, p1.sx + p1.sw, p1.sy, p2.sx - p2.sw, p2.sx + p2.sw, p2.sy, 'rgba(160,190,230,' + 0.1 * rainR + ')');
    for (const pd of s.pud) {
      const rx = p1.sw * 0.13;
      ctx.fillStyle = 'rgba(120,150,190,' + 0.55 * rainR + ')';
      ctx.beginPath(); ctx.ellipse(p1.sx + p1.sw * pd.o, p1.sy, rx, Math.max(1, rx * 0.2), 0, 0, 7); ctx.fill();
    }
  }
}
function drawRain() {
  ctx.strokeStyle = 'rgba(200,220,255,' + 0.45 * rainR + ')'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  const n = Math.floor(rainDrops.length * rainR);
  for (let i = 0; i < n; i++) {
    const d = rainDrops[i];
    d.y += d.v * 0.025 * (0.6 + speed / MAXSPEED); d.x -= 0.003;
    if (d.y > 1) { d.y = -0.05; d.x = Math.random(); }
    if (d.x < 0) d.x += 1;
    const px = d.x * W, py = d.y * H;
    ctx.moveTo(px, py); ctx.lineTo(px - 4, py + 16);
  }
  ctx.stroke();
}

// ---------- HUD ----------
function txt(s, x, y, size, col, align, weight) {
  ctx.font = (weight || '700') + ' ' + size + 'px system-ui, sans-serif';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillText(s, x + 2, y + 2);
  ctx.fillStyle = col || '#fff'; ctx.fillText(s, x, y);
}
function drawHUD() {
  const f = Math.max(14, Math.min(W, H) * 0.04);
  if (state === 'play' || state === 'crash' || state === 'over') {
    txt('SCORE ' + Math.floor(score), 14, f + 8, f, '#fff');
    txt((dist * 0.02 / 1000).toFixed(2) + ' km', 14, f * 2 + 10, f * 0.7, '#cfe8ff', 'left', '600');
    txt('BEST ' + best, W - 14, f + 8, f * 0.8, '#ffd76a', 'right');
    txt(Math.round(speed / MAXSPEED * 140) + ' km/h', W / 2, H - 14, f * 1.1, '#fff', 'center');
    for (const fl of floaters) {
      ctx.globalAlpha = clamp(1.4 - fl.t, 0, 1);
      txt(fl.txt, W / 2, H * 0.28 - fl.t * 24, f * 0.9, fl.bad ? '#ff8a6b' : '#7dffb0', 'center');
      ctx.globalAlpha = 1;
    }
    if (isTouch && state === 'play') {
      const b = brakeBtn(), h = hornBtn();
      ctx.fillStyle = touch.brake ? 'rgba(255,80,80,0.6)' : 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
      txt('BRAKE', b.x, b.y + 6, 15, '#fff', 'center');
      ctx.fillStyle = touch.horn ? 'rgba(255,200,60,0.6)' : 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, 7); ctx.fill();
      txt('HORN', h.x, h.y + 6, 15, '#fff', 'center');
    }
  }
  if (toast && state !== 'menu' && state !== 'over') {
    ctx.globalAlpha = clamp(Math.min(toast.t * 2, 3 - toast.t), 0, 1);
    txt(toast.txt, W / 2, H * 0.14, f * 1.2, '#fff', 'center', '700');
    ctx.globalAlpha = 1;
  }
  if (state === 'menu') {
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, H * 0.14, W, H * 0.5);
    txt('KERALA HIGHWAY RIDER', W / 2, H * 0.28, Math.min(W * 0.075, H * 0.1), '#ffd76a', 'center', '800');
    txt('From the backwaters to the tea hills', W / 2, H * 0.28 + f * 1.5, f * 0.95, '#fff', 'center', '600');
    txt('Weave through buses, autos and lorries. Watch for cows on the road.', W / 2, H * 0.28 + f * 3.0, f * 0.72, '#e8f4ff', 'center', '500');
    txt(isTouch ? 'Touch left or right side to steer  ·  BRAKE and HORN buttons' : 'Left / Right steer  ·  Down brake  ·  Space or H horn  ·  M sound  ·  F fullscreen', W / 2, H * 0.28 + f * 4.0, f * 0.72, '#e8f4ff', 'center', '500');
    if (Math.floor(tClock * 2) % 2 === 0) txt(isTouch ? 'TAP TO START' : 'PRESS ENTER OR CLICK TO START', W / 2, H * 0.28 + f * 5.6, f, '#7dffb0', 'center');
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, H * 0.22, W, H * 0.36);
    txt('CRASHED!', W / 2, H * 0.34, Math.min(W * 0.08, H * 0.11), '#ff6b6b', 'center', '800');
    txt('Score ' + Math.floor(score) + '    Best ' + best + '    ' + (dist * 0.02 / 1000).toFixed(2) + ' km', W / 2, H * 0.34 + f * 1.8, f, '#fff', 'center');
    if (overT > 0.7 && Math.floor(tClock * 2) % 2 === 0) txt(isTouch ? 'TAP TO RIDE AGAIN' : 'PRESS ENTER OR CLICK TO RIDE AGAIN', W / 2, H * 0.34 + f * 3.4, f * 0.9, '#7dffb0', 'center');
  }
}

// ---------- main loop ----------
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
  last = ts;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
spawnTraffic();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
